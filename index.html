<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能检测算法验证台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>

  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel2: #0c0c0c;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --dim: #78716c;
    --line: rgba(255,255,255,0.08);
    --accent: #34d399;
    --accent-dim: rgba(52,211,153,0.18);
    --accent-text: #022c22;
    --yolo: #f59e0b;
    --pruned: #22d3ee;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100dvh;
    overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }
  button, input, textarea { font: inherit; }
  .shell {
    max-width: 1480px; margin: 0 auto;
    height: 100dvh; width: 100%;
    overflow: hidden;
    display: flex; flex-direction: column; padding: 16px 20px 18px;
  }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 12px; flex-shrink: 0;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px; padding: 2px 10px; font-size: 10px;
    background: rgba(255,255,255,0.04); color: #57534e; transition: .2s;
  }
  .chip.on { background: var(--accent-dim); color: #6ee7b7; }
  .arrow { color: #44403c; font-size: 10px; }
  .layout {
    display: grid; grid-template-columns: 400px 1fr; gap: 12px;
    flex: 1; min-height: 0;
  }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-size: 11px; color: var(--muted); gap: 8px;
  }
  .panel-h .mono { font-family: 'IBM Plex Mono', monospace; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 0; border-radius: 999px; padding: 2px 10px; font-size: 10px;
    background: rgba(255,255,255,0.04); color: #57534e; cursor: pointer;
  }
  .tab.active { background: var(--accent-dim); color: #a7f3d0; }
  textarea#code {
    flex: 1; min-height: 0; overflow: auto; resize: none; border: 0; outline: none;
    background: transparent; color: rgba(167,243,208,0.92);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    line-height: 1.6; padding: 0 12px 12px;
  }
  .sliders { background: var(--panel); border-radius: 8px; padding: 12px; margin-top: 10px; flex-shrink: 0; }
  .slider-row { margin-bottom: 12px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-meta {
    display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px;
  }
  .slider-meta span:first-child { color: var(--muted); }
  .slider-meta span:last-child {
    font-family: 'IBM Plex Mono', monospace; color: #6ee7b7;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    border-radius: 999px; background: #2a2a2a; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 999px;
    background: var(--accent); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--accent); border: none; cursor: pointer;
  }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; flex-shrink: 0; }
  .sample-btn {
    border: 0; border-radius: 999px; padding: 4px 10px; font-size: 11px;
    background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer;
  }
  .sample-btn:hover { color: #d6d3d1; }
  .sample-btn.active { background: var(--accent-dim); color: #a7f3d0; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0; }
  .btn {
    border: 0; border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { flex: 1; background: #34d399; color: var(--accent-text); }
  .btn-primary:hover:not(:disabled) { background: #10b981; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #fafaf9; border: 1px solid rgba(255,255,255,0.12); }
  .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .btn-ghost.active-cmp {
    background: rgba(34,211,238,0.18); color: #67e8f9;
    border-color: rgba(34,211,238,0.5);
  }
  .term {
    margin-top: 10px; height: 96px; overflow: auto; overscroll-behavior: contain;
    border-radius: 8px; flex-shrink: 0;
    background: var(--panel2); padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.55;
    color: #a8a29e;
  }
  .term .cmd { color: #6ee7b7; }
  .term .done { color: #a7f3d0; }
  .term .idle { color: #57534e; }
  .right { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .right-h {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    flex-shrink: 0;
  }
  .right-h h2 { margin: 0; font-size: 13px; font-weight: 600; color: #e7e5e4; }
  .right-h .file { font-size: 10px; color: #78716c; font-family: 'IBM Plex Mono', monospace; }
  .callouts {
    display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0;
  }
  .callout {
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.01em; border: 1.5px solid transparent;
  }
  .callout.good {
    background: rgba(74,222,128,0.16); color: #4ade80;
    border-color: rgba(74,222,128,0.55);
  }
  .callout.warn {
    background: rgba(251,191,36,0.14); color: #fbbf24;
    border-color: rgba(251,191,36,0.5);
  }
  .callout.info {
    background: rgba(34,211,238,0.14); color: #22d3ee;
    border-color: rgba(34,211,238,0.5);
  }
  .viewport {
    flex: 1; min-height: 0; background: var(--panel); border-radius: 8px;
    position: relative; overflow: hidden; display: flex; gap: 10px; padding: 10px;
  }
  .view-col {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel2, #141414); border-radius: 8px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .view-col.yolo-col { border-color: rgba(245,158,11,0.55); }
  .view-col.pruned-col { border-color: rgba(34,211,238,0.55); }
  .view-col .label {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 6px; flex-shrink: 0;
    font-size: 12px; font-weight: 700; letter-spacing: 0.01em;
    color: #e7e5e4; background: #141414;
    border-bottom: 1px solid var(--line);
  }
  .view-col.yolo-col .label { color: #fbbf24; }
  .view-col.pruned-col .label { color: #67e8f9; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .dot.yolo { background: #f59e0b; }
  .dot.pruned { background: #22d3ee; }
  .panel-switch {
    flex-shrink: 0; display: flex; gap: 4px;
    padding: 6px 8px 8px; background: #0f0f0f;
  }
  .panel-switch button {
    flex: 1; border: 0; border-radius: 6px;
    padding: 5px 8px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.04); color: #78716c; cursor: pointer;
  }
  .panel-switch button:hover:not(.active) { color: #d6d3d1; }
  .panel-switch button.active {
    background: var(--accent-dim); color: #a7f3d0;
  }
  .yolo-col .panel-switch button.active {
    background: rgba(245,158,11,0.18); color: #fbbf24;
  }
  .pruned-col .panel-switch button.active {
    background: rgba(34,211,238,0.18); color: #67e8f9;
  }
  .curve-stage {
    flex: 1; min-height: 280px; background: #fff;
    position: relative; overflow: hidden;
  }
  .curve-stage svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%; display: block;
  }
  /* Roboflow-style: full natural image first; charts collapsible */
  .scene {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 10px;
    background: #050505;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .scene-frame {
    position: relative;
    width: 419px;
    height: 419px;
    flex-shrink: 0;
    display: block;
    max-width: none;
    line-height: 0;
    border-radius: 6px;
    overflow: visible;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  .scene-img {
    display: block;
    width: 419px;
    height: 419px;
    object-fit: none;
    max-width: none;
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
  }
  .scene-overlay { position: absolute; inset: 0; pointer-events: none; }
  /* Roboflow / Ultralytics YOLO playground style */
  .box {
    position: absolute;
    border-style: solid;
    border-width: 2px;
    border-radius: 0;
    box-shadow: none;
    opacity: 0;
  }
  .box.show { opacity: 1; transition: opacity 0.22s ease; }
  .col-status {
    font-size: 11px; color: var(--muted); padding: 0 10px 6px;
    min-height: 18px;
  }
  .col-status.busy { color: #fbbf24; }
  .col-status.done { color: #4ade80; }
  .box span {
    position: absolute;
    top: 0; left: 0;
    transform: translateY(-100%);
    white-space: nowrap;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    padding: 1px 5px;
    border-radius: 0;
    border: none;
    box-shadow: none;
    letter-spacing: 0;
    color: #111;
  }
  .col-metrics {
    flex-shrink: 0; padding: 8px 10px 10px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    border-top: 1px solid var(--line); background: #0a0a0a;
  }
  .cm .k { font-size: 10px; color: #a8a29e; font-weight: 500; }
  .cm .v {
    margin-top: 2px; font-family: 'IBM Plex Mono', monospace;
    font-size: 16px; font-weight: 700; color: #fafaf9; line-height: 1.1;
  }
  .cm .delta {
    margin-top: 2px; font-size: 11px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .cm .delta.up { color: #4ade80; }
  .cm .delta.down { color: #f87171; }
  .cm .delta.flat { color: #fbbf24; }
  .loading {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--muted); font-size: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 999px;
    border: 2px solid rgba(52,211,153,0.7); border-top-color: transparent;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .metrics {
    background: var(--panel); border-radius: 8px; padding: 10px 14px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .metrics-h {
    display: flex; justify-content: space-between; margin-bottom: 8px;
    font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .metrics-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
  }
  @media (max-width: 720px) {
    .metrics-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .metric .k { font-size: 10px; color: #a8a29e; font-weight: 500; }
  .metric .v {
    margin-top: 2px; font-family: 'IBM Plex Mono', monospace;
    font-size: 18px; font-weight: 700; color: #fafaf9;
  }
  .metric .delta {
    margin-top: 2px; font-size: 11px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .metric .delta.up { color: #4ade80; }
  .metric .delta.down { color: #f87171; }
  .classes {
    margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;
  }
  .class-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.05); color: #d6d3d1;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .left-col {
    display: flex; flex-direction: column; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
  }


  .wizard {
    background: var(--panel); border-radius: 8px; padding: 12px; margin-top: 10px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .wiz-step { margin-bottom: 14px; }
  .wiz-step:last-child { margin-bottom: 0; }
  .wiz-label {
    font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .wiz-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 999px; font-size: 10px;
    background: var(--accent-dim); color: #a7f3d0; font-weight: 700;
  }
  .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .import-card {
    border: 1px dashed rgba(255,255,255,0.14); border-radius: 8px;
    padding: 10px; background: rgba(255,255,255,0.02);
    display: flex; flex-direction: column; gap: 6px; min-height: 88px;
  }
  .import-card.ready { border-style: solid; border-color: rgba(52,211,153,0.45); background: rgba(52,211,153,0.06); }
  .import-card .ic-title { font-size: 11px; font-weight: 600; color: #e7e5e4; }
  .import-card .ic-file {
    font-size: 10px; color: #a8a29e; font-family: 'IBM Plex Mono', monospace;
    word-break: break-all; min-height: 28px;
  }
  .import-card .ic-file.empty { color: #57534e; }
  .status-chip {
    align-self: flex-start; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 600;
    background: rgba(255,255,255,0.05); color: #78716c;
  }
  .status-chip.on { background: var(--accent-dim); color: #6ee7b7; }
  .file-btn {
    border: 0; border-radius: 6px; padding: 6px 8px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.08); color: #e7e5e4; cursor: pointer; text-align: center;
  }
  .file-btn:hover { background: rgba(255,255,255,0.14); }
  .file-btn input { display: none; }
  .img-import-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .img-preview-mini {
    width: 56px; height: 56px; border-radius: 6px; object-fit: cover;
    background: #1c1917; border: 1px solid rgba(255,255,255,0.08);
  }
  .img-meta { flex: 1; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .progress-bar {
    height: 4px; border-radius: 999px; background: #2a2a2a; overflow: hidden; margin-top: 8px;
  }
  .progress-bar > i {
    display: block; height: 100%; width: 0%; background: var(--accent);
    transition: width .25s ease;
  }
  .timing-row {
    display: flex; gap: 8px; margin-top: 6px; font-size: 10px;
    font-family: 'IBM Plex Mono', monospace; color: #a8a29e;
  }
  .timing-row .t-orig { color: #fbbf24; }
  .timing-row .t-pruned { color: #67e8f9; }

</style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>智能检测算法验证台</h1>
        <p class="sub">草莓病害监测 · 原始模型 vs 剪枝+INT8 质减量增</p>
      </div>
      <div class="chips" id="pipeline">
        <span class="chip" data-step="0">导入模型</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="1">导入图像</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="2">开始验证</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="3">对比完成</span>
      </div>
    </header>

    <div class="layout">
      <div class="left-col">
        <div class="panel" style="flex:1">
          <div class="panel-h">
            <span class="mono" id="codeFile">prune_quantize.py</span>
            <div class="tabs">
              <button type="button" class="tab active" data-tab="prune">剪枝量化</button>
              <button type="button" class="tab" data-tab="validate">测试验证</button>
            </div>
          </div>
          <textarea id="code" spellcheck="false" aria-label="Python 代码"></textarea>
        </div>

        <div class="sliders">
          <div class="slider-row">
            <div class="slider-meta"><span>prune_ratio · L1剪枝比例</span><span id="pruneVal">0.20</span></div>
            <input type="range" id="prune_ratio" min="0.05" max="0.5" step="0.01" value="0.2" />
          </div>
          <div class="slider-row">
            <div class="slider-meta"><span>threshold · 检测置信度</span><span id="thresholdVal">0.52</span></div>
            <input type="range" id="threshold" min="0.3" max="0.7" step="0.01" value="0.52" />
          </div>
        </div>

        <div class="wizard" id="wizard">
          <div class="wiz-step">
            <div class="wiz-label"><span class="wiz-num">1</span>导入双模型（原始模型 + 剪枝量化模型）</div>
            <div class="model-grid">
              <div class="import-card" id="cardOrig">
                <div class="ic-title">原始模型</div>
                <div class="ic-file empty" id="origFileName">未选择文件</div>
                <span class="status-chip" id="origChip">待导入</span>
                <label class="file-btn">选择文件
                  <input type="file" id="origModelInput" accept=".pt,.onnx,.engine,*/*" />
                </label>
              </div>
              <div class="import-card" id="cardPruned">
                <div class="ic-title">剪枝量化模型</div>
                <div class="ic-file empty" id="prunedFileName">未选择文件</div>
                <span class="status-chip" id="prunedChip">待导入</span>
                <label class="file-btn">选择文件
                  <input type="file" id="prunedModelInput" accept=".pt,.onnx,.engine,*/*" />
                </label>
              </div>
            </div>
          </div>

          <div class="wiz-step">
            <div class="wiz-label"><span class="wiz-num">2</span>导入检测图像（上传或选择样例）</div>
            <div class="img-import-row">
              <img class="img-preview-mini" id="imgPreview" alt="" hidden />
              <div class="img-meta">
                <div class="ic-file empty" id="imgFileName">未选择图像</div>
                <span class="status-chip" id="imgChip">待导入</span>
                <label class="file-btn" style="align-self:flex-start">上传图像
                  <input type="file" id="imageInput" accept="image/*" />
                </label>
              </div>
            </div>
            <div class="samples" id="samples"></div>
          </div>

          <div class="wiz-step">
            <div class="wiz-label"><span class="wiz-num">3</span>开始验证对比</div>
            <div class="actions" style="margin-top:0">
              <button class="btn btn-primary" id="btnValidate" type="button" disabled>开始验证</button>
            </div>
            <div class="progress-bar" id="progressBar" hidden><i id="progressFill"></i></div>
            <div class="timing-row" id="timingRow" hidden>
              <span class="t-orig" id="tOrig">原始模型 —</span>
              <span class="t-pruned" id="tPruned">剪枝量化 —</span>
            </div>
          </div>
        </div>

        <div class="term" id="term"><div class="idle">$ 请先导入模型与图像，再点击「开始验证」…</div></div>
      </div>

      <div class="right">
        <div class="right-h">
          <h2 id="viewTitle">等待验证</h2>
          <span class="file" id="sampleFile">—</span>
        </div>
        <div class="callouts" id="callouts" hidden></div>
        <div class="viewport" id="viewport"></div>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>
  </div>

<script>

  lastResult: null,

};

function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function fmt(n, d=1) { return Number(n).toFixed(d); }

function prunedMetrics(pruneRatio) {
  const r = clamp(pruneRatio, 0.05, 0.5);
  const d = r - 0.2;
  return {
    conf: clamp(0.85 - d * 0.4, 0.72, 0.93),
    params: clamp(12.9 - d * 18, 8.0, 18.0),
    sizeMB: clamp(3.3 - d * 5, 2.2, 5.0),
    inferMs: clamp(34.3 + d * 18, 26.0, 45.0),
    fps: clamp(29.2 - d * 12, 20.0, 36.0),
    precision: clamp(87.8 - d * 12, 80.0, 94.0),
    recall: clamp(86.0 - d * 10, 78.0, 92.0),
    speedGain: clamp(40 - d * 40, 20, 55),
  };
}

function confDisplay(base, thr) {
  return clamp(base + (thr - 0.52) * 0.15, 0.45, 0.99);
}

function synthesizeBoxes(kind) {
  const geom = [
    {id:'u1',label:'炭疽果腐',x:30,y:26,w:40,h:44,yoloConf:0.95,prunedConf:0.85},
    {id:'u2',label:'病斑果',x:52,y:54,w:20,h:18,yoloConf:0.91,prunedConf:0.81},
  ];
  return geom.map(b => ({
    id: b.id, label: b.label, x: b.x, y: b.y, w: b.w, h: b.h,
    baseConf: kind === 'yolo' ? b.yoloConf : b.prunedConf,
  }));
}

function buildPruneCode(pruneRatio) {
  return PRUNE_TEMPLATE.replace(/prune_ratio=0\.2/g, `prune_ratio=${pruneRatio.toFixed(2)}`);
}

function parsePruneRatio(code) {
  const m = code.match(/prune_ratio\s*=\s*([0-9]*\.?[0-9]+)/);
  if (!m) return null;
  const v = clamp(parseFloat(m[1]), 0.05, 0.5);
  return Number.isNaN(v) ? null : v;
}

function sampleMeta() {
  return SAMPLES.find(s => s.id === state.sample) || null;
}

function wizardReady() {
  return !!(state.originalModel && state.prunedModel && (state.sample || state.imageUrl));
}

function updateWizardUI() {
  const oReady = !!state.originalModel;
  const pReady = !!state.prunedModel;
  const iReady = !!(state.sample || state.imageUrl);

  document.getElementById('cardOrig').classList.toggle('ready', oReady);
  document.getElementById('cardPruned').classList.toggle('ready', pReady);
  document.getElementById('origFileName').textContent = oReady ? state.originalModel : '未选择文件';
  document.getElementById('origFileName').classList.toggle('empty', !oReady);
  document.getElementById('prunedFileName').textContent = pReady ? state.prunedModel : '未选择文件';
  document.getElementById('prunedFileName').classList.toggle('empty', !pReady);
  document.getElementById('origChip').textContent = oReady ? '已导入' : '待导入';
  document.getElementById('origChip').classList.toggle('on', oReady);
  document.getElementById('prunedChip').textContent = pReady ? '已导入' : '待导入';
  document.getElementById('prunedChip').classList.toggle('on', pReady);

  const imgName = state.imageName || (sampleMeta() && sampleMeta().file) || '未选择图像';
  document.getElementById('imgFileName').textContent = iReady ? imgName : '未选择图像';
  document.getElementById('imgFileName').classList.toggle('empty', !iReady);
  document.getElementById('imgChip').textContent = iReady ? '已导入' : '待导入';
  document.getElementById('imgChip').classList.toggle('on', iReady);

  const preview = document.getElementById('imgPreview');
  const src = currentImageSrc();
  if (src) {
    preview.src = src;
    preview.hidden = false;
  } else {
    preview.hidden = true;
    preview.removeAttribute('src');
  }

  document.getElementById('btnValidate').disabled = !wizardReady() || state.running;

  let step = -1;
  if (oReady && pReady) step = 0;
  if (oReady && pReady && iReady) step = 1;
  if (state.mode === 'compare' && !state.running) step = 3;
  else if (state.running) step = 2;
  else if (wizardReady()) step = 1;
  setPipeline(step);
}

function currentImageSrc() {
  if (state.imageUrl) return state.imageUrl;
  if (state.sample) return `samples/${state.sample}.jpg`;
  return null;
}

function sampleImgHTML() {
  const src = currentImageSrc();
  if (!src) return '<div class="loading" style="min-height:200px">请先导入图像</div>';
  return `<img class="scene-img" src="${src}" width="419" height="419" alt="" draggable="false" decoding="sync" />`;
}

function boxesHTML(boxes, kind) {
  return boxes.map(b => {
    const conf = (b.conf != null ? b.conf : confDisplay(b.baseConf, state.threshold));
    const name = enLabel(b.label);
    const color = classColor(name);
    const shown = b.show === false ? '' : ' show';
    // Roboflow YOLO playground: thin box + same-color label chip, dark text
    return `<div class="box ${kind}${shown}" style="left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%;border-color:${color}"><span style="background:${color}">${name} ${Number(conf).toFixed(2)}</span></div>`;
  }).join('');
}

function precisionConfidenceSVG(kind) {
  const series = kind === 'yolo' ? CURVE_BASELINE : CURVE_PRUNED;
  const ann = kind === 'yolo' ? CURVE_ANNOTATION.baseline : CURVE_ANNOTATION.pruned;
  const W=640, H=460, ML=44, MR=18, MT=26, MB=78;
  const PW=W-ML-MR, PH=H-MT-MB;
  const ticks=[0,0.2,0.4,0.6,0.8,1];
  const toPath = (s) => s.x.map((x,i) => {
    const px = ML + x * PW;
    const py = MT + (1 - s.y[i]) * PH;
    return `${i===0?'M':'L'}${px.toFixed(2)},${py.toFixed(2)}`;
  }).join(' ');
  let grid = '';
  ticks.forEach(t => {
    const gx = ML + t*PW, gy = MT + (1-t)*PH;
    grid += `<line x1="${gx}" y1="${MT}" x2="${gx}" y2="${MT+PH}" stroke="#d0d0d0" stroke-width="0.8"/>`;
    grid += `<line x1="${ML}" y1="${gy}" x2="${ML+PW}" y2="${gy}" stroke="#d0d0d0" stroke-width="0.8"/>`;
    grid += `<text x="${gx}" y="${MT+PH+14}" text-anchor="middle" fill="#333" font-size="10" font-family="DejaVu Sans,Arial,sans-serif">${t.toFixed(1)}</text>`;
    grid += `<text x="${ML-6}" y="${gy+3}" text-anchor="end" fill="#333" font-size="10" font-family="DejaVu Sans,Arial,sans-serif">${t.toFixed(1)}</text>`;
  });
  const thin = series.filter(s=>!s.thick).map(s=>`<path d="${toPath(s)}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const thick = series.filter(s=>s.thick).map(s=>`<path d="${toPath(s)}" fill="none" stroke="${s.color}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const ax = ML + ann.x*PW, ay = MT + (1-ann.y)*PH;
  const labelY = kind === 'yolo' ? ay-8 : Math.min(ay+14, MT+PH-4);
  let legend = '';
  const cols = 2, gapX = 310, gapY = 14;
  series.forEach((s,i) => {
    const col = i % cols, row = Math.floor(i / cols);
    legend += `<g transform="translate(${col*gapX},${row*gapY})"><line x1="0" y1="5" x2="16" y2="5" stroke="${s.color}" stroke-width="${s.thick?3:1.5}"/><text x="20" y="8" fill="#222" font-size="9" font-family="DejaVu Sans,Arial,sans-serif">${s.name}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Precision-Confidence Curve" preserveAspectRatio="xMidYMid meet">
    <rect width="${W}" height="${H}" fill="#fff"/>
    <text x="${ML+PW/2}" y="18" text-anchor="middle" fill="#1a1a1a" font-size="12" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600">Precision-Confidence Curve</text>
    <rect x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="#fafafa" stroke="#333" stroke-width="1"/>
    ${grid}
    <text x="${ML+PW/2}" y="${MT+PH+28}" text-anchor="middle" fill="#222" font-size="11" font-family="DejaVu Sans,Arial,sans-serif">Confidence</text>
    <text x="14" y="${MT+PH/2}" text-anchor="middle" fill="#222" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" transform="rotate(-90 14 ${MT+PH/2})">Precision</text>
    ${thin}${thick}
    <circle cx="${ax}" cy="${ay}" r="3.2" fill="#1f77b4" stroke="#fff" stroke-width="1"/>
    <text x="${Math.min(ax+4, ML+PW-4)}" y="${labelY}" text-anchor="${ax>ML+PW*0.55?'end':'start'}" fill="#1f77b4" font-size="10" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600">${ann.text}</text>
    <g transform="translate(${ML},${H-42})">${legend}</g>
  </svg>`;
}

function colMetricsHTML(m, kind) {
  const isOrig = kind === 'yolo';
  const confDelta = isOrig ? '' : `<div class="delta down">↓ ${(ORIGINAL_BASE.conf - m.conf).toFixed(2)}</div>`;
  const speedDelta = isOrig ? '' : `<div class="delta up">↑ +${fmt(m.speedGain,0)}%</div>`;
  const sizeDelta = isOrig ? '' : `<div class="delta up">↓ ${fmt(((ORIGINAL_BASE.sizeMB - m.sizeMB)/ORIGINAL_BASE.sizeMB)*100,0)}%</div>`;
  return `<div class="col-metrics">
    <div class="cm"><div class="k">置信度</div><div class="v">${m.conf.toFixed(2)}</div>${confDelta}</div>
    <div class="cm"><div class="k">推理速度</div><div class="v">${fmt(m.inferMs,0)}ms</div>${speedDelta}</div>
    <div class="cm"><div class="k">模型体积</div><div class="v">${fmt(m.sizeMB,1)}MB</div>${sizeDelta}</div>
  </div>`;
}

function setPipeline(step) {

function renderSamples() {

function getBoxes(kind) {
  if (state.running) {
    if (kind === 'yolo') return state.liveYolo || [];
    return state.livePruned || [];
  }
  if (state.lastResult) {
    if (kind === 'yolo') return state.lastResult.yolo?.boxes || state.lastResult.original?.boxes || [];
    return state.lastResult.pruned?.boxes || [];
  }
  if (state.sample && SAMPLE_BOXES[state.sample]) {
    return SAMPLE_BOXES[state.sample][kind === 'yolo' ? 'yolo' : 'pruned'];
  }
  return synthesizeBoxes(kind === 'yolo' ? 'yolo' : 'pruned').map(b => ({...b, conf: confDisplay(b.baseConf, state.threshold)}));
}

function alignedPair(sampleId) {
  const thr = state.threshold;
  let y = sampleBoxes(sampleId, 'yolo') || synthesizeBoxes('yolo');
  let p = sampleBoxes(sampleId, 'pruned') || synthesizeBoxes('pruned');
  // Force identical geometry; only conf may differ
  p = y.map((b, i) => {
    const src = p[i] || b;
    return { ...b, baseConf: src.baseConf != null ? src.baseConf : b.baseConf * 0.9 };
  });
  y = y.map(b => ({ ...b, conf: confDisplay(b.baseConf, thr), show: true }));
  p = p.map(b => ({ ...b, conf: confDisplay(b.baseConf, thr), show: true }));
  return { yolo: y, pruned: p };
}

function viewColumn(title, kind, boxes, metrics) {
  const colClass = kind === 'yolo' ? 'yolo-col' : 'pruned-col';
  const dotClass = kind === 'yolo' ? 'yolo' : 'pruned';
  const showImage = state.panel !== 'curve';
  const imageActive = showImage ? ' class="active"' : '';
  const curveActive = showImage ? '' : ' class="active"';
  const status = kind === 'yolo' ? state.statusYolo : state.statusPruned;
  const statusCls = status.includes('完成') ? 'done' : (status ? 'busy' : '');
  const body = showImage
    ? `<div class="scene">
      <div class="scene-frame">
        ${sampleImgHTML()}
        <div class="scene-overlay">${boxesHTML(boxes, kind)}</div>
      </div>
    </div>`
    : `<div class="curve-stage">${precisionConfidenceSVG(kind)}</div>`;
  return `<div class="view-col ${colClass}">
    <div class="label"><span class="dot ${dotClass}"></span>${title}</div>
    <div class="col-status ${statusCls}">${status || ''}</div>
    <div class="panel-switch">
      <button type="button" data-action="set-panel" data-panel="image"${imageActive}>检测样图</button>
      <button type="button" data-action="set-panel" data-panel="curve"${curveActive}>P-C 曲线</button>
    </div>
    ${body}
    ${colMetricsHTML(metrics, kind)}
  </div>`;
}

function renderViewport() {
  const vp = document.getElementById('viewport');
  const title = document.getElementById('viewTitle');
  const method = state.lastResult?.pruned?.metrics || prunedMetrics(state.prune_ratio);
  renderCallouts(method);

  if (state.running) {
    title.textContent = '验证执行中 · 对比出框速度';
    const method = prunedMetrics(state.prune_ratio);
    const yBoxes = getBoxes('yolo');
    const pBoxes = getBoxes('pruned');
    vp.className = 'viewport cmp';
    vp.innerHTML =
      viewColumn('原始模型', 'yolo', yBoxes, ORIGINAL_BASE) +
      viewColumn('剪枝+INT8 质减量增', 'pruned', pBoxes, method);
    return;
  }
  if (state.mode !== 'compare') {
    title.textContent = currentImageSrc() ? '图像预览' : '等待验证';
    vp.className = 'viewport';
    if (currentImageSrc()) {
      vp.innerHTML = `<div class="view-col" style="flex:1;border-color:rgba(255,255,255,0.08)"><div class="scene"><div class="scene-frame">${sampleImgHTML()}</div></div></div>`;
    } else {
      vp.innerHTML = `<div class="loading"><div>请完成向导：导入双模型 + 图像后点击「开始验证」</div></div>`;
    }
    return;
  }
  const yBoxes = getBoxes('yolo');
  const pBoxes = getBoxes('pruned');
  const yMetrics = state.lastResult?.yolo?.metrics || state.lastResult?.original?.metrics || ORIGINAL_BASE;

  title.textContent = '原始模型 · 剪枝+INT8 质减量增';
  vp.className = 'viewport cmp';
  vp.innerHTML =
    viewColumn('原始模型', 'yolo', yBoxes, yMetrics) +
    viewColumn('剪枝+INT8 质减量增', 'pruned', pBoxes, method);
}

function setRunningUI(on) {
  state.running = on;
  document.getElementById('btnValidate').disabled = on || !wizardReady();
  document.getElementById('code').disabled = on;
  document.getElementById('prune_ratio').disabled = on;
  document.getElementById('threshold').disabled = on;
  document.getElementById('origModelInput').disabled = on;
  document.getElementById('prunedModelInput').disabled = on;
  document.getElementById('imageInput').disabled = on;
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function appendTerm(line, cls) {
  const term = document.getElementById('term');
  const p = document.createElement('div');
  if (cls) p.className = cls;
  p.textContent = line;
  term.appendChild(p);
  term.scrollTop = term.scrollHeight;
}

async function runValidate() {
  if (state.running || !wizardReady()) return;
  state.mode = 'compare';
  setRunningUI(true);
  setPipeline(2);
  updateWizardUI();
  renderViewport();

  const term = document.getElementById('term');
  term.innerHTML = '';
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const timingRow = document.getElementById('timingRow');
  bar.hidden = false;
  timingRow.hidden = false;
  fill.style.width = '0%';
  document.getElementById('tOrig').textContent = '原始模型 推理中…';
  document.getElementById('tPruned').textContent = '剪枝量化 等待中…';

  const sampleId = state.sample || 'upload';
  const imageName = state.imageName || (sampleMeta() && sampleMeta().file) || 'upload.jpg';

  let result = null;
  try {
    const res = await fetch('/api/infer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sample: sampleId,
        prune_ratio: state.prune_ratio,
        threshold: state.threshold,
        mode: 'compare',
        script: state.tab === 'validate' ? 'validate' : 'prune',
        original_model: state.originalModel,
        pruned_model: state.prunedModel,
        image_name: imageName,
      }),
    });
    result = await res.json();
  } catch (e) {
    result = null;
  }

  const pair = alignedPair(sampleId);
  // Prefer API boxes only if same count+geometry; else use aligned pair
  const apiY = result?.yolo?.boxes || result?.original?.boxes;
  const apiP = result?.pruned?.boxes;
  let yBoxes = pair.yolo;
  let pBoxes = pair.pruned;
  if (apiY && apiP && apiY.length === apiP.length) {
    const same = apiY.every((b, i) =>
      Math.abs(b.x - apiP[i].x) < 0.01 && Math.abs(b.y - apiP[i].y) < 0.01 &&
      Math.abs(b.w - apiP[i].w) < 0.01 && Math.abs(b.h - apiP[i].h) < 0.01 &&
      (b.label === apiP[i].label)
    );
    if (same) {
      yBoxes = apiY.map(b => ({...b, show: true}));
      pBoxes = apiP.map(b => ({...b, show: true}));
    } else {
      // Keep geometry from YOLO side; copy pruned confs by index if possible
      yBoxes = apiY.map(b => ({...b, show: true}));
      pBoxes = apiY.map((b, i) => ({
        ...b,
        conf: apiP[i]?.conf != null ? apiP[i].conf : confDisplay((b.baseConf || b.conf || 0.9) * 0.9, state.threshold),
        baseConf: apiP[i]?.baseConf != null ? apiP[i].baseConf : (b.baseConf || 0.85),
        show: true,
      }));
    }
  }

  const metrics = result?.pruned?.metrics || prunedMetrics(state.prune_ratio);
  const origMs = result?.timing?.original_ms || 2000;
  const prunedMs = result?.timing?.pruned_ms || 1200;

  result = {
    logs: result?.logs || [],
    timing: { original_ms: origMs, pruned_ms: prunedMs },
    pruned: { metrics, boxes: pBoxes.map(b => ({...b, show: true})) },
    yolo: { metrics: ORIGINAL_BASE, boxes: yBoxes.map(b => ({...b, show: true})) },
    original: { metrics: ORIGINAL_BASE, boxes: yBoxes.map(b => ({...b, show: true})) },
  };

  // Start with empty overlays; reveal boxes with speed difference (parallel)
  state.liveYolo = yBoxes.map(b => ({...b, show: false}));
  state.livePruned = pBoxes.map(b => ({...b, show: false}));
  state.statusYolo = '推理中…';
  state.statusPruned = '推理中…';
  state.panel = 'image';
  renderViewport();

  appendTerm('$ 开始验证对比（双侧并行）', 'cmd');
  appendTerm(`原始模型: ${state.originalModel}`);
  appendTerm(`剪枝量化模型: ${state.prunedModel}`);
  appendTerm(`检测图像: ${imageName}`);
  appendTerm(`检测框对齐: ${yBoxes.length} 个（位置/数量相同，置信度不同）`);
  appendTerm('── 双侧并行推理 ──', 'cmd');
  fill.style.width = '8%';

  async function revealSide(kind, fullBoxes, waitMs, staggerMs, label) {
    const t0 = performance.now();
    const tick = setInterval(() => {
      const elapsed = performance.now() - t0;
      const frac = Math.min(1, elapsed / waitMs);
      if (kind === 'yolo') fill.style.width = `${8 + frac * 42}%`;
      else fill.style.width = `${50 + frac * 42}%`;
    }, 80);
    await sleep(waitMs);
    clearInterval(tick);
    const liveKey = kind === 'yolo' ? 'liveYolo' : 'livePruned';
    const statusKey = kind === 'yolo' ? 'statusYolo' : 'statusPruned';
    for (let i = 0; i < fullBoxes.length; i++) {
      state[liveKey] = fullBoxes.map((b, j) => ({...b, show: j <= i}));
      state[statusKey] = `出框 ${i + 1}/${fullBoxes.length}`;
      renderViewport();
      await sleep(staggerMs);
    }
    const sec = ((performance.now() - t0) / 1000).toFixed(2);
    state[statusKey] = `完成 · ${sec}s`;
    renderViewport();
    appendTerm(`${label}完成 · ${sec}s`, 'done');
    return sec;
  }

  document.getElementById('tOrig').textContent = '原始模型 推理中…';
  document.getElementById('tPruned').textContent = '剪枝量化 推理中…';

  const [elapsedOrig, elapsedPruned] = await Promise.all([
    revealSide('yolo', yBoxes, origMs, 140, '原始模型'),
    revealSide('pruned', pBoxes, prunedMs, 80, '剪枝量化'),
  ]);

  document.getElementById('tOrig').textContent = `原始模型 ${elapsedOrig}s`;
  document.getElementById('tPruned').textContent = `剪枝量化 ${elapsedPruned}s (~40%↑)`;
  appendTerm(`对比指标  conf=${metrics.conf.toFixed(2)}  size=${fmt(metrics.sizeMB)}MB  speed=+${fmt(metrics.speedGain,0)}%`, 'done');
  fill.style.width = '100%';

  state.lastResult = result;
  state.liveYolo = null;
  state.livePruned = null;
  state.statusYolo = '';
  state.statusPruned = '';
  setRunningUI(false);
  setPipeline(3);
  updateWizardUI();
  renderViewport();
  renderMetrics();
  setTimeout(() => { bar.hidden = true; }, 800);
}

function clearUploadUrl() {
  if (state.objectUrl) {
    URL.revokeObjectURL(state.objectUrl);
    state.objectUrl = null;
  }
}

function refresh() {
  updateSliderLabels();
  syncCodeFromState();
  renderSamples();
  updateWizardUI();
  renderViewport();
  renderMetrics();
}

document.getElementById('samples').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (!btn || state.running) return;
  clearUploadUrl();
  state.sample = btn.dataset.id;
  state.imageKind = 'sample';
  state.imageUrl = null;
  state.imageName = sampleMeta().file;
  document.getElementById('imageInput').value = '';
  refresh();
});

document.getElementById('origModelInput').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  state.originalModel = f ? f.name : null;
  updateWizardUI();
});

document.getElementById('prunedModelInput').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  state.prunedModel = f ? f.name : null;
  updateWizardUI();
});

document.getElementById('imageInput').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  clearUploadUrl();
  state.objectUrl = URL.createObjectURL(f);
  state.imageUrl = state.objectUrl;
  state.imageName = f.name;
  state.imageKind = 'upload';
  state.sample = null;
  refresh();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if (state.running) return;
    state.tab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
    syncCodeFromState();
  });
});

document.getElementById('prune_ratio').addEventListener('input', (e) => {
  state.prune_ratio = Number(e.target.value);
  updateSliderLabels();
  if (state.tab === 'prune') syncCodeFromState();
  renderMetrics();
  if (state.mode === 'compare') {
    renderCallouts(prunedMetrics(state.prune_ratio));
    renderViewport();
  }
});

document.getElementById('threshold').addEventListener('input', (e) => {
  state.threshold = Number(e.target.value);
  updateSliderLabels();
  if (state.mode === 'compare') renderViewport();
});

document.getElementById('code').addEventListener('input', (e) => {
  if (state.tab !== 'prune') return;
  const parsed = parsePruneRatio(e.target.value);
  if (parsed == null) return;
  state.syncing = true;
  state.prune_ratio = parsed;
  updateSliderLabels();
  renderMetrics();
});

document.getElementById('btnValidate').addEventListener('click', () => runValidate());

document.getElementById('viewport').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="set-panel"]');
  if (!btn) return;
  const panel = btn.dataset.panel;
  if (panel !== 'image' && panel !== 'curve') return;
  state.panel = panel;
  renderViewport();
});

refresh();
setPipeline(-1);
</script>
</body>
</html>
