<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能检测算法验证台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #111111;
    --panel2: #0c0c0c;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --dim: #78716c;
    --line: rgba(255,255,255,0.08);
    --accent: #34d399;
    --accent-dim: rgba(52,211,153,0.18);
    --accent-text: #022c22;
    --yolo: #f59e0b;
    --pruned: #22d3ee;
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; height: 100dvh;
    overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }
  button, input, textarea { font: inherit; }
  .shell {
    max-width: 1480px; margin: 0 auto;
    height: 100dvh; width: 100%;
    overflow: hidden;
    display: flex; flex-direction: column; padding: 16px 20px 18px;
  }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 12px; flex-shrink: 0;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip {
    border-radius: 999px; padding: 2px 10px; font-size: 10px;
    background: rgba(255,255,255,0.04); color: #57534e; transition: .2s;
  }
  .chip.on { background: var(--accent-dim); color: #6ee7b7; }
  .arrow { color: #44403c; font-size: 10px; }
  .layout {
    display: grid; grid-template-columns: 400px 1fr; gap: 12px;
    flex: 1; min-height: 0;
  }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel); border-radius: 8px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .panel-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; font-size: 11px; color: var(--muted); gap: 8px;
  }
  .panel-h .mono { font-family: 'IBM Plex Mono', monospace; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 0; border-radius: 999px; padding: 2px 10px; font-size: 10px;
    background: rgba(255,255,255,0.04); color: #57534e; cursor: pointer;
  }
  .tab.active { background: var(--accent-dim); color: #a7f3d0; }
  textarea#code {
    flex: 1; min-height: 0; overflow: auto; resize: none; border: 0; outline: none;
    background: transparent; color: rgba(167,243,208,0.92);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    line-height: 1.6; padding: 0 12px 12px;
  }
  .sliders { background: var(--panel); border-radius: 8px; padding: 12px; margin-top: 10px; flex-shrink: 0; }
  .slider-row { margin-bottom: 12px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-meta {
    display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px;
  }
  .slider-meta span:first-child { color: var(--muted); }
  .slider-meta span:last-child {
    font-family: 'IBM Plex Mono', monospace; color: #6ee7b7;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    border-radius: 999px; background: #2a2a2a; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 999px;
    background: var(--accent); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--accent); border: none; cursor: pointer;
  }
  .samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; flex-shrink: 0; }
  .sample-btn {
    border: 0; border-radius: 999px; padding: 4px 10px; font-size: 11px;
    background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer;
  }
  .sample-btn:hover { color: #d6d3d1; }
  .sample-btn.active { background: var(--accent-dim); color: #a7f3d0; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0; }
  .btn {
    border: 0; border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { flex: 1; background: #34d399; color: var(--accent-text); }
  .btn-primary:hover:not(:disabled) { background: #10b981; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #fafaf9; border: 1px solid rgba(255,255,255,0.12); }
  .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .btn-ghost.active-cmp {
    background: rgba(34,211,238,0.18); color: #67e8f9;
    border-color: rgba(34,211,238,0.5);
  }
  .term {
    margin-top: 10px; height: 96px; overflow: auto; overscroll-behavior: contain;
    border-radius: 8px; flex-shrink: 0;
    background: var(--panel2); padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.55;
    color: #a8a29e;
  }
  .term .cmd { color: #6ee7b7; }
  .term .done { color: #a7f3d0; }
  .term .idle { color: #57534e; }
  .right { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .right-h {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    flex-shrink: 0;
  }
  .right-h h2 { margin: 0; font-size: 13px; font-weight: 600; color: #e7e5e4; }
  .right-h .file { font-size: 10px; color: #78716c; font-family: 'IBM Plex Mono', monospace; }
  .callouts {
    display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0;
  }
  .callout {
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.01em; border: 1.5px solid transparent;
  }
  .callout.good {
    background: rgba(74,222,128,0.16); color: #4ade80;
    border-color: rgba(74,222,128,0.55);
  }
  .callout.warn {
    background: rgba(251,191,36,0.14); color: #fbbf24;
    border-color: rgba(251,191,36,0.5);
  }
  .callout.info {
    background: rgba(34,211,238,0.14); color: #22d3ee;
    border-color: rgba(34,211,238,0.5);
  }
  .viewport {
    flex: 1; min-height: 0; background: var(--panel); border-radius: 8px;
    position: relative; overflow: hidden; display: flex; gap: 10px; padding: 10px;
  }
  .view-col {
    flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--panel2, #141414); border-radius: 8px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.06);
  }
  .view-col.yolo-col { border-color: rgba(245,158,11,0.55); }
  .view-col.pruned-col { border-color: rgba(34,211,238,0.55); }
  .view-col .label {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 6px; flex-shrink: 0;
    font-size: 12px; font-weight: 700; letter-spacing: 0.01em;
    color: #e7e5e4; background: #141414;
    border-bottom: 1px solid var(--line);
  }
  .view-col.yolo-col .label { color: #fbbf24; }
  .view-col.pruned-col .label { color: #67e8f9; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .dot.yolo { background: #f59e0b; }
  .dot.pruned { background: #22d3ee; }
  .panel-switch {
    flex-shrink: 0; display: flex; gap: 4px;
    padding: 6px 8px 8px; background: #0f0f0f;
  }
  .panel-switch button {
    flex: 1; border: 0; border-radius: 6px;
    padding: 5px 8px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,0.04); color: #78716c; cursor: pointer;
  }
  .panel-switch button:hover:not(.active) { color: #d6d3d1; }
  .panel-switch button.active {
    background: var(--accent-dim); color: #a7f3d0;
  }
  .yolo-col .panel-switch button.active {
    background: rgba(245,158,11,0.18); color: #fbbf24;
  }
  .pruned-col .panel-switch button.active {
    background: rgba(34,211,238,0.18); color: #67e8f9;
  }
  .curve-stage {
    flex: 1; min-height: 280px; background: #fff;
    position: relative; overflow: hidden;
  }
  .curve-stage svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%; display: block;
  }
  /* Roboflow-style: full natural image first; charts collapsible */
  .scene {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 10px;
    background: #050505;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .scene-frame {
    position: relative;
    width: 419px;
    height: 419px;
    flex-shrink: 0;
    display: block;
    max-width: none;
    line-height: 0;
    border-radius: 6px;
    overflow: visible;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  .scene-img {
    display: block;
    width: 419px;
    height: 419px;
    object-fit: none;
    max-width: none;
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
  }
  .scene-overlay { position: absolute; inset: 0; pointer-events: none; }
  .box {
    position: absolute; border-style: solid; border-width: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55);
  }
  .box.yolo { border-color: #f59e0b; }
  .box.pruned { border-color: #22d3ee; }
  .box span {
    position: absolute; top: -22px; left: -1px; white-space: nowrap;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px;
    color: #fff; letter-spacing: 0.01em;
    background: #1c1917; border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  .box.yolo span { background: #92400e; border-color: #f59e0b; }
  .box.pruned span { background: #0e7490; border-color: #22d3ee; }
  .col-metrics {
    flex-shrink: 0; padding: 8px 10px 10px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    border-top: 1px solid var(--line); background: #0a0a0a;
  }
  .cm .k { font-size: 10px; color: #a8a29e; font-weight: 500; }
  .cm .v {
    margin-top: 2px; font-family: 'IBM Plex Mono', monospace;
    font-size: 16px; font-weight: 700; color: #fafaf9; line-height: 1.1;
  }
  .cm .delta {
    margin-top: 2px; font-size: 11px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .cm .delta.up { color: #4ade80; }
  .cm .delta.down { color: #f87171; }
  .cm .delta.flat { color: #fbbf24; }
  .loading {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--muted); font-size: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 999px;
    border: 2px solid rgba(52,211,153,0.7); border-top-color: transparent;
    animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .metrics {
    background: var(--panel); border-radius: 8px; padding: 10px 14px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .metrics-h {
    display: flex; justify-content: space-between; margin-bottom: 8px;
    font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .metrics-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
  }
  @media (max-width: 720px) {
    .metrics-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .metric .k { font-size: 10px; color: #a8a29e; font-weight: 500; }
  .metric .v {
    margin-top: 2px; font-family: 'IBM Plex Mono', monospace;
    font-size: 18px; font-weight: 700; color: #fafaf9;
  }
  .metric .delta {
    margin-top: 2px; font-size: 11px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  .metric .delta.up { color: #4ade80; }
  .metric .delta.down { color: #f87171; }
  .classes {
    margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;
  }
  .class-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.05); color: #d6d3d1;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .left-col {
    display: flex; flex-direction: column; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
  }
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>智能检测算法验证台</h1>
        <p class="sub">草莓病害监测 · YOLO原本 vs 剪枝+INT8 质减量增</p>
      </div>
      <div class="chips" id="pipeline">
        <span class="chip" data-step="0">Load YOLO</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="1">Prune</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="2">INT8</span>
        <span class="arrow">→</span>
        <span class="chip" data-step="3">done</span>
      </div>
    </header>

    <div class="layout">
      <div class="left-col">
        <div class="panel" style="flex:1">
          <div class="panel-h">
            <span class="mono" id="codeFile">prune_quantize.py</span>
            <div class="tabs">
              <button type="button" class="tab active" data-tab="prune">剪枝量化</button>
              <button type="button" class="tab" data-tab="validate">测试验证</button>
            </div>
          </div>
          <textarea id="code" spellcheck="false" aria-label="Python 代码"></textarea>
        </div>

        <div class="sliders">
          <div class="slider-row">
            <div class="slider-meta"><span>prune_ratio · L1剪枝比例</span><span id="pruneVal">0.20</span></div>
            <input type="range" id="prune_ratio" min="0.05" max="0.5" step="0.01" value="0.2" />
          </div>
          <div class="slider-row">
            <div class="slider-meta"><span>threshold · 检测置信度</span><span id="thresholdVal">0.52</span></div>
            <input type="range" id="threshold" min="0.3" max="0.7" step="0.01" value="0.52" />
          </div>
        </div>

        <div class="samples" id="samples"></div>

        <div class="actions">
          <button class="btn btn-primary" id="btnRun" type="button">运行 · 剪枝+量化</button>
          <button class="btn btn-ghost" id="btnCompare" type="button">对比 YOLO</button>
        </div>

        <div class="term" id="term"><div class="idle">$ 等待运行…</div></div>
      </div>

      <div class="right">
        <div class="right-h">
          <h2 id="viewTitle">样本预览</h2>
          <span class="file" id="sampleFile">samples/normal.jpg</span>
        </div>
        <div class="callouts" id="callouts" hidden></div>
        <div class="viewport" id="viewport"></div>
        <div class="metrics" id="metrics"></div>
      </div>
    </div>
  </div>

<script>
const PRUNE_TEMPLATE = "from ultralytics import YOLO\nimport torch\nfrom torch.nn.utils import prune\nimport onnxruntime.quantization as quant\n\nmodel = YOLO(\"./weights/bch.pt\")\n\ndef model_prune(model_obj, prune_ratio=0.2):\n    for name, module in model_obj.model.named_modules():\n        if hasattr(module, \"weight\") and isinstance(module, torch.nn.Conv2d):\n            prune.l1_unstructured(module, name=\"weight\", amount=prune_ratio)\n            prune.remove(module, \"weight\")\n    return model_obj\n\npruned_model = model_prune(model, prune_ratio=0.2)\n\npruned_model.export(format=\"onnx\", opset=17, simplify=True)\n\nonnx_input_path = \"./weights/bch.onnx\"\nonnx_quant_out = \"./weights/bch_int8.onnx\"\n\nquant.quantize_dynamic(\n    model_input=onnx_input_path,\n    model_output=onnx_quant_out,\n    weight_type=quant.QuantType.QUInt8\n)\nprint(\"\u526a\u679d+INT8\u91cf\u5316\u5b8c\u6210\")";
const VALIDATE_CODE = "import os\nimport yaml\nfrom ultralytics import YOLO\n\ndef validate_testset():\n    project_root = \".\"\n    model_path = os.path.join(project_root, \"weights\", \"bch.pt\")\n    data_config_path = os.path.join(project_root, \"data.yaml\")\n    result_save_path = os.path.join(project_root, \"runs\", \"test_validation\")\n    os.makedirs(result_save_path, exist_ok=True)\n    with open(data_config_path, 'r', encoding='utf-8') as f:\n        data_config = yaml.safe_load(f)\n        test_dir = os.path.join(data_config.get(\"path\", \".\"), data_config.get(\"test\", \"test/images\"))\n        print(f\"\u6d4b\u8bd5\u96c6\u5b9e\u9645\u8def\u5f84: {test_dir}\")\n        if not os.path.exists(test_dir):\n            raise FileNotFoundError(f\"\u6d4b\u8bd5\u96c6\u76ee\u5f55\u4e0d\u5b58\u5728\uff1a{test_dir}\")\n    if not os.path.exists(model_path):\n        raise FileNotFoundError(f\"\u6a21\u578b\u6587\u4ef6\u4e0d\u5b58\u5728\uff1a{model_path}\")\n    model = YOLO(model_path)\n    print(f\"\u6a21\u578b\u52a0\u8f7d\u6210\u529f: {model_path}\")\n    val_params = {\n        \"data\": data_config_path,\n        \"split\": \"test\",\n        \"device\": \"0\",\n        \"save\": True,\n        \"save_dir\": result_save_path,\n        \"plots\": True,\n        \"verbose\": True\n    }\n    print(\"\u5f00\u59cb\u6d4b\u8bd5\u96c6\u9a8c\u8bc1...\")\n    metrics = model.val(**val_params)\n    metrics_path = os.path.join(result_save_path, \"test_metrics.txt\")\n    with open(metrics_path, 'w', encoding='utf-8') as f:\n        f.write(\"### \u6d4b\u8bd5\u96c6\u8bc4\u4f30\u7ed3\u679c ###\\n\")\n        f.write(f\"\u6574\u4f53mAP50-95: {metrics.box.map:.4f}\\n\")\n        f.write(f\"mAP50: {metrics.box.map50:.4f}\\n\")\n        f.write(f\"mAP75: {metrics.box.map75:.4f}\\n\")\n        f.write(f\"\u5e73\u5747\u7cbe\u786e\u7387 (P): {metrics.box.mp:.4f}\\n\")\n        f.write(f\"\u5e73\u5747\u53ec\u56de\u7387 (R): {metrics.box.mr:.4f}\\n\\n\")\n        f.write(\"### \u5404\u7c7b\u522b\u6307\u6807 ###\\n\")\n        for i, class_name in enumerate(metrics.names):\n            f.write(f\"{class_name}: mAP50-95={metrics.box.maps[i]:.4f}\\n\")\n    print(f\"\u9a8c\u8bc1\u5b8c\u6210\uff01\u7ed3\u679c\u5df2\u4fdd\u5b58\u81f3\uff1a{result_save_path}\")\n\nif __name__ == \"__main__\":\n    validate_testset()";

const CLASSES = ['角斑病','炭疽病','花枯病','灰霉病','叶斑病','白粉病果实','白粉病叶片'];

const SAMPLES = [
  { id: 'normal', label: '正常', file: 'samples/normal.jpg' },
  { id: 'small', label: '小目标', file: 'samples/small.jpg' },
  { id: 'occlusion', label: '遮挡', file: 'samples/occlusion.jpg' },
  { id: 'lowlight', label: '弱光', file: 'samples/lowlight.jpg' },
  { id: 'complex', label: '复杂', file: 'samples/complex.jpg' },
];

/* Excel-aligned bold metrics */
const YOLO_BASE = {
  conf: 0.95, sizeMB: 6.6, inferMs: 48, fps: 20.8,
  precision: 97.6, recall: 90.7, params: 25.8, speedGain: 0
};
const PRUNED_BASE = {
  conf: 0.85, sizeMB: 3.6, inferMs: 41.7, fps: 24.0,
  precision: 92.0, recall: 88.6, params: 14.2, speedGain: 15
};

const SAMPLE_BOXES = {
  /* coords % of square scene; images are ~1:1 with object-fit:contain */
  normal: {
    /* large brown necrosis center→right; scattered spots on green left */
    yolo: [
      {id:'n1',label:'叶斑病',x:42,y:28,w:40,h:42,baseConf:0.95},
      {id:'n2',label:'灰霉病',x:18,y:18,w:24,h:28,baseConf:0.91}
    ],
    pruned: [
      {id:'n1',label:'叶斑病',x:40,y:26,w:42,h:44,baseConf:0.85},
      {id:'n2',label:'灰霉病',x:16,y:16,w:26,h:30,baseConf:0.82},
      {id:'n3',label:'角斑病',x:58,y:62,w:18,h:16,baseConf:0.78}
    ],
  },
  small: {

function prunedMetrics(pruneRatio) {
  const r = clamp(pruneRatio, 0.05, 0.5);

  const d = r - 0.2;

function confDisplay(base, thr) {

function buildPruneCode(pruneRatio) {
  return PRUNE_TEMPLATE.replace(/prune_ratio=0\.2/g, `prune_ratio=${pruneRatio.toFixed(2)}`);

function parsePruneRatio(code) {
  const m = code.match(/prune_ratio\s*=\s*([0-9]*\.?[0-9]+)/);
  if (!m) return null;
  const v = clamp(parseFloat(m[1]), 0.05, 0.5);
  return Number.isNaN(v) ? null : v;
}

  let legend = '';
  const cols = 2, gapX = 310, gapY = 14;
  series.forEach((s,i) => {
    const col = i % cols, row = Math.floor(i / cols);
    legend += `<g transform="translate(${col*gapX},${row*gapY})"><line x1="0" y1="5" x2="16" y2="5" stroke="${s.color}" stroke-width="${s.thick?3:1.5}"/><text x="20" y="8" fill="#222" font-size="9" font-family="DejaVu Sans,Arial,sans-serif">${s.name}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Precision-Confidence Curve" preserveAspectRatio="xMidYMid meet">
    <rect width="${W}" height="${H}" fill="#fff"/>
    <text x="${ML+PW/2}" y="18" text-anchor="middle" fill="#1a1a1a" font-size="12" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600">Precision-Confidence Curve</text>
    <rect x="${ML}" y="${MT}" width="${PW}" height="${PH}" fill="#fafafa" stroke="#333" stroke-width="1"/>
    ${grid}
    <text x="${ML+PW/2}" y="${MT+PH+28}" text-anchor="middle" fill="#222" font-size="11" font-family="DejaVu Sans,Arial,sans-serif">Confidence</text>
    <text x="14" y="${MT+PH/2}" text-anchor="middle" fill="#222" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" transform="rotate(-90 14 ${MT+PH/2})">Precision</text>
    ${thin}${thick}
    <circle cx="${ax}" cy="${ay}" r="3.2" fill="#1f77b4" stroke="#fff" stroke-width="1"/>
    <text x="${Math.min(ax+4, ML+PW-4)}" y="${labelY}" text-anchor="${ax>ML+PW*0.55?'end':'start'}" fill="#1f77b4" font-size="10" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600">${ann.text}</text>
    <g transform="translate(${ML},${H-42})">${legend}</g>
  </svg>`;
}

function colMetricsHTML(m, kind) {
  const isYolo = kind === 'yolo';
  const confDelta = isYolo ? '' : `<div class="delta down">↓ ${(YOLO_BASE.conf - m.conf).toFixed(2)}</div>`;
  const speedDelta = isYolo ? '' : `<div class="delta up">↑ +${fmt(m.speedGain,0)}%</div>`;
  const sizeDelta = isYolo ? '' : `<div class="delta up">↓ ${fmt(((YOLO_BASE.sizeMB - m.sizeMB)/YOLO_BASE.sizeMB)*100,0)}%</div>`;
  return `<div class="col-metrics">
    <div class="cm"><div class="k">置信度</div><div class="v">${m.conf.toFixed(2)}</div>${confDelta}</div>
    <div class="cm"><div class="k">推理速度</div><div class="v">${fmt(m.inferMs,0)}ms</div>${speedDelta}</div>
    <div class="cm"><div class="k">模型体积</div><div class="v">${fmt(m.sizeMB,1)}MB</div>${sizeDelta}</div>
  </div>`;
}

function setPipeline(step) {
  document.querySelectorAll('#pipeline .chip').forEach(el => {
    el.classList.toggle('on', Number(el.dataset.step) <= step);
  });
}

function renderSamples() {
  const el = document.getElementById('samples');
  el.innerHTML = SAMPLES.map(s =>
    `<button type="button" class="sample-btn ${s.id===state.sample?'active':''}" data-id="${s.id}">${s.label}</button>`
  ).join('');
}

function updateRunLabel() {
  const btn = document.getElementById('btnRun');
  if (state.tab === 'validate') {
    btn.textContent = '运行 · validate_testset.py';
  } else {
    btn.textContent = '运行 · 剪枝+量化';
  }
  document.getElementById('btnCompare').classList.toggle('active-cmp', state.mode === 'compare');
}

function syncCodeFromState() {
  if (state.syncing) { state.syncing = false; return; }
  const ta = document.getElementById('code');
  if (state.tab === 'validate') {
    ta.value = VALIDATE_CODE;
    document.getElementById('codeFile').textContent = 'validate_testset.py';
  } else {
    ta.value = buildPruneCode(state.prune_ratio);
    document.getElementById('codeFile').textContent = 'prune_quantize.py';
  }
  updateRunLabel();
}

function updateSliderLabels() {
  document.getElementById('pruneVal').textContent = state.prune_ratio.toFixed(2);
  document.getElementById('thresholdVal').textContent = state.threshold.toFixed(2);
  document.getElementById('prune_ratio').value = state.prune_ratio;
  document.getElementById('threshold').value = state.threshold;
  document.getElementById('sampleFile').textContent = sampleMeta().file;
}

function renderCallouts(method) {
  const el = document.getElementById('callouts');
  if (state.mode !== 'compare' || state.running) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  const sizeDrop = ((YOLO_BASE.sizeMB - method.sizeMB) / YOLO_BASE.sizeMB) * 100;
  el.hidden = false;
  el.innerHTML = `
    <span class="callout good">体积 -${fmt(sizeDrop,0)}%</span>
    <span class="callout good">速度 +${fmt(method.speedGain,0)}%</span>
    <span class="callout warn">置信度 ${YOLO_BASE.conf.toFixed(2)}→${method.conf.toFixed(2)}</span>
    <span class="callout info">6.6MB → ${fmt(method.sizeMB,1)}MB</span>`;
}

function renderMetrics() {
  const method = state.lastResult?.pruned?.metrics || prunedMetrics(state.prune_ratio);
  const el = document.getElementById('metrics');
  const classTags = `<div class="classes">${CLASSES.map(c=>`<span class="class-tag">${c}</span>`).join('')}</div>`;

  if (state.mode === 'compare') {
    const sizeDrop = ((YOLO_BASE.sizeMB - method.sizeMB) / YOLO_BASE.sizeMB) * 100;
    el.innerHTML = `
      <div class="metrics-h"><span>Excel 实测对比 · YOLO原本 vs 剪枝+INT8</span><span>质减量增</span></div>
      <div class="metrics-grid">
        <div class="metric"><div class="k">置信度 · YOLO</div><div class="v" style="color:#fbbf24">${YOLO_BASE.conf.toFixed(2)}</div></div>
        <div class="metric"><div class="k">置信度 · 剪枝</div><div class="v" style="color:#67e8f9">${method.conf.toFixed(2)}</div><div class="delta down">↓ ${(YOLO_BASE.conf-method.conf).toFixed(2)}</div></div>
        <div class="metric"><div class="k">推理加速</div><div class="v" style="color:#4ade80">+${fmt(method.speedGain,0)}%</div><div class="delta up">剪枝后提升</div></div>
        <div class="metric"><div class="k">体积 · YOLO</div><div class="v">${fmt(YOLO_BASE.sizeMB,1)}MB</div></div>
        <div class="metric"><div class="k">体积 · 剪枝</div><div class="v" style="color:#4ade80">${fmt(method.sizeMB,1)}MB</div><div class="delta up">↓ ${fmt(sizeDrop,0)}%</div></div>
        <div class="metric"><div class="k">Precision@Conf</div><div class="v">${fmt(YOLO_BASE.precision,1)}→${fmt(method.precision,1)}</div></div>
      </div>${classTags}`;
  } else {
    const items = [
      ['置信度', method.conf.toFixed(2), ''],
      ['推理', `${fmt(method.inferMs,0)}ms`, `<div class="delta up">↑ +${fmt(method.speedGain,0)}%</div>`],
      ['体积', `${fmt(method.sizeMB,1)}MB`, `<div class="delta up">6.6→${fmt(method.sizeMB,1)}</div>`],
      ['Precision', `${fmt(method.precision)}%`, ''],
      ['Recall', `${fmt(method.recall)}%`, ''],
      ['FPS', fmt(method.fps), ''],
    ];
    el.innerHTML = `
      <div class="metrics-h"><span>质减量增 · 剪枝+INT8</span><span>prune_ratio=${state.prune_ratio.toFixed(2)}</span></div>
      <div class="metrics-grid">${items.map(([k,v,d])=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div>${d}</div>`).join('')}</div>${classTags}`;
  }
}

function viewColumn(title, kind, boxes, metrics) {
  const colClass = kind === 'yolo' ? 'yolo-col' : 'pruned-col';
  const dotClass = kind === 'yolo' ? 'yolo' : 'pruned';
  const showImage = state.panel !== 'curve';
  const imageActive = showImage ? ' class="active"' : '';
  const curveActive = showImage ? '' : ' class="active"';
  const body = showImage
    ? `<div class="scene">
      <div class="scene-frame">
        ${sampleImg(state.sample)}
        <div class="scene-overlay">${boxesHTML(boxes, kind)}</div>
      </div>
    </div>`
    : `<div class="curve-stage">${precisionConfidenceSVG(kind)}</div>`;
  return `<div class="view-col ${colClass}">
    <div class="label"><span class="dot ${dotClass}"></span>${title}</div>
    <div class="panel-switch">
      <button type="button" data-action="set-panel" data-panel="image"${imageActive}>检测样图</button>
      <button type="button" data-action="set-panel" data-panel="curve"${curveActive}>P-C 曲线</button>
    </div>
    ${body}
    ${colMetricsHTML(metrics, kind)}
  </div>`;
}

function renderViewport() {
  const vp = document.getElementById('viewport');
  const title = document.getElementById('viewTitle');
  const method = state.lastResult?.pruned?.metrics || prunedMetrics(state.prune_ratio);
  renderCallouts(method);

  if (state.running) {
    title.textContent = '执行中';
    vp.className = 'viewport';
    vp.innerHTML = `<div class="loading"><div class="spinner"></div><div>执行中…</div></div>`;
    return;
  }
  if (state.mode === 'idle') {
    title.textContent = '样本预览';
    vp.className = 'viewport';
    vp.innerHTML = `<div class="view-col" style="flex:1;border-color:rgba(255,255,255,0.08)"><div class="scene"><div class="scene-frame">${sampleImg(state.sample)}</div></div></div>`;
    return;
  }
  const boxes = SAMPLE_BOXES[state.sample];
  const pBoxes = state.lastResult?.pruned?.boxes || boxes.pruned;
  const yBoxes = state.lastResult?.yolo?.boxes || boxes.yolo;
  const yMetrics = state.lastResult?.yolo?.metrics || YOLO_BASE;

  if (state.mode === 'compare') {
    title.textContent = 'YOLO原本 · 剪枝+INT8 质减量增';
    vp.className = 'viewport cmp';
    vp.innerHTML =
      viewColumn('YOLO 原本', 'yolo', yBoxes, yMetrics) +
      viewColumn('剪枝+INT8 质减量增', 'pruned', pBoxes, method);
  } else {
    title.textContent = '质减量增 · 病虫害检测结果';
    vp.className = 'viewport';
    vp.innerHTML = viewColumn('剪枝+INT8 质减量增', 'pruned', pBoxes, method);
  }
}

function setRunningUI(on) {
  state.running = on;
  document.getElementById('btnRun').disabled = on;
  document.getElementById('btnCompare').disabled = on;
  document.getElementById('code').disabled = on;
  document.getElementById('prune_ratio').disabled = on;
  document.getElementById('threshold').disabled = on;
}

async function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runInfer(mode) {
  if (state.running) return;
  state.mode = mode;
  setRunningUI(true);
  setPipeline(-1);
  updateRunLabel();
  renderViewport();
  const term = document.getElementById('term');
  term.innerHTML = '';
  const script = state.tab === 'validate' && mode === 'single' ? 'validate' : 'prune';

  let result = null;
  try {
    const res = await fetch('/api/infer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sample: state.sample,
        prune_ratio: state.prune_ratio,
        threshold: state.threshold,
        mode,
        script,
      }),
    });
    result = await res.json();
  } catch (e) {
    const metrics = prunedMetrics(state.prune_ratio);
    result = {
      logs: script === 'validate' ? [
        '$ python validate_testset.py',
        '加载 data.yaml / weights/bch.pt…',
        '模型加载成功: ./weights/bch.pt',
        '开始测试集验证 (split=test)…',
        `done. conf=${metrics.conf.toFixed(2)}  size=${fmt(metrics.sizeMB)}MB  speed=+${fmt(metrics.speedGain,0)}%`,
      ] : [
        '$ python prune_quantize.py',
        "Loading YOLO('./weights/bch.pt')…",
        `L1 unstructured prune Conv2d (prune_ratio=${state.prune_ratio.toFixed(2)})…`,
        'Export ONNX (opset=17, simplify=True)…',
        'quantize_dynamic → ./weights/bch_int8.onnx',
        '剪枝+INT8量化完成',
        `mock infer ${sampleMeta().file}  conf=${metrics.conf.toFixed(2)}  size=${fmt(metrics.sizeMB)}MB  speed=+${fmt(metrics.speedGain,0)}%`,
      ],
      pruned: { metrics, boxes: SAMPLE_BOXES[state.sample].pruned.map(b => ({...b, conf: confDisplay(b.baseConf, state.threshold)})) },
      yolo: { metrics: YOLO_BASE, boxes: SAMPLE_BOXES[state.sample].yolo.map(b => ({...b, conf: confDisplay(b.baseConf, state.threshold)})) },
    };
  }

  const logs = result.logs || [];
  for (let i = 0; i < logs.length; i++) {
    const line = logs[i];
    const cls = line.startsWith('$') ? 'cmd' : (line.startsWith('done') || line.includes('完成')) ? 'done' : '';
    const p = document.createElement('div');
    p.className = cls;
    p.textContent = line;
    term.appendChild(p);
    term.scrollTop = term.scrollHeight;
    if (script === 'validate') {
      if (i === 2) setPipeline(0);
      if (i === 3) setPipeline(1);
      if (i === 4) setPipeline(3);
    } else {
      if (i === 1) setPipeline(0);
      if (i === 2) setPipeline(1);
      if (i === 4) setPipeline(2);
      if (i >= 5) setPipeline(3);
    }
    await sleep(i === 0 ? 160 : 280);
  }

  state.lastResult = result;
  setRunningUI(false);
  updateRunLabel();
  renderViewport();
  renderMetrics();
}

function refresh() {
  updateSliderLabels();
  syncCodeFromState();
  renderSamples();
  renderViewport();
  renderMetrics();
}

document.getElementById('samples').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-id]');
  if (!btn || state.running) return;
  state.sample = btn.dataset.id;
  refresh();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    if (state.running) return;
    state.tab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
    syncCodeFromState();
  });
});

document.getElementById('prune_ratio').addEventListener('input', (e) => {
  state.prune_ratio = Number(e.target.value);
  updateSliderLabels();
  if (state.tab === 'prune') syncCodeFromState();
  renderMetrics();
  if (state.mode === 'compare' || state.mode === 'single') {
    renderCallouts(prunedMetrics(state.prune_ratio));
    renderViewport();
  }
});

document.getElementById('threshold').addEventListener('input', (e) => {
  state.threshold = Number(e.target.value);
  updateSliderLabels();
  if (state.mode !== 'idle') renderViewport();
});

document.getElementById('code').addEventListener('input', (e) => {
  if (state.tab !== 'prune') return;
  const parsed = parsePruneRatio(e.target.value);
  if (parsed == null) return;
  state.syncing = true;
  state.prune_ratio = parsed;
  updateSliderLabels();
  renderMetrics();
});

document.getElementById('btnRun').addEventListener('click', () => runInfer('single'));
document.getElementById('viewport').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="set-panel"]');
  if (!btn) return;
  const panel = btn.dataset.panel;
  if (panel !== 'image' && panel !== 'curve') return;
  state.panel = panel;
  renderViewport();
});

document.getElementById('btnCompare').addEventListener('click', () => {
  state.tab = 'prune';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'prune'));
  syncCodeFromState();
  runInfer('compare');
});

refresh();
setPipeline(3);
document.getElementById('term').innerHTML = '<div class="cmd">$ python prune_quantize.py</div><div class="done">剪枝+INT8量化完成</div><div>mock infer samples/normal.jpg  conf=0.85  size=3.6MB  speed=+15%</div>';
document.getElementById('btnCompare').classList.add('active-cmp');
</script>
</body>
</html>
